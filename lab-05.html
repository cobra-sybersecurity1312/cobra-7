<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>لاب 5: فك الشفرة</title>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;padding:20px;background:#e8f5e9}
.c{background:#fff;padding:20px;border-radius:8px;box-shadow:0 4px 8px #0002;max-width:640px;margin:auto}
h1{color:#2e7d32;text-align:center;font-size:22px}code,pre{direction:ltr;display:block;background:#f3f3f3;padding:10px;border-radius:6px;font-size:13px;word-break:break-all;white-space:pre-wrap;text-align:left}
input{padding:9px;width:100%;box-sizing:border-box;margin:6px 0;border:1px solid #bbb;border-radius:4px;direction:ltr}
.btn{padding:9px 16px;background:#2e7d32;color:#fff;border:0;border-radius:5px;cursor:pointer;font-size:15px}#out{margin-top:12px;font-weight:bold}
</style></head><body><div class="c">
<h1>🟢 لاب 5: فك الشفرة</h1>
<p>اعترضنا رسالة بين عضوين في الفريق وكانت مشفرة بـ <b>Base64</b>. فك الشفرة وهتلاقي الـ Flag جواها.</p>
<code>Q29icmEgdGVhbTogdGhlIHNlY3JldCBpcyBGTEFHe0Jhc2U2NF9EZWNvZGVkfQ==</code>
<p>أداة فك Base64:</p><input id="i" placeholder="الصق النص المشفر هنا"><button class="btn" onclick="d()">فك الشفرة</button><p id="out" dir="ltr"></p>
</div><script>
function d(){const o=document.getElementById('out');try{o.textContent=atob(document.getElementById('i').value.trim())}catch(e){o.textContent='❌ نص Base64 غير صالح'}}
</script></body></html>
