function ytId(url){try{const u=new URL(url);let id=u.hostname.includes("youtu.be")?u.pathname.slice(1):u.searchParams.get("v");if(!id&&u.pathname.includes("/embed/"))id=u.pathname.split("/embed/")[1];return id?id.split("&")[0].split("?")[0]:""}catch(e){return ""}}

function fetchIds(p,tok,n){
  if(tok!==renderTok||!player)return;let ids=null;try{ids=player.getPlaylist()}catch(e){}
  if(ids&&ids.length){p._ids=ids;renderList();loadTitles(p,tok)}
  else if(n<25)setTimeout(()=>fetchIds(p,tok,n+1),700);
}
async function loadTitles(p,tok){
  const need=p._ids.filter(id=>!titleCache[id]);
  for(let i=0;i<need.length;i+=6){
    if(tok!==renderTok)return;
    await Promise.all(need.slice(i,i+6).map(async id=>{try{const r=await fetch("https://www.youtube.com/oembed?url="+encodeURIComponent("https://www.youtube.com/watch?v="+id)+"&format=json");if(!r.ok)return;const j=await r.json();if(j&&j.title)titleCache[id]=j.title}catch(e){}}));
    saveJSON("cobra7_titles",titleCache);if(modal.classList.contains("show"))renderList();
  }
}
/* ---------- فتح/قفل النافذة ---------- */
function openCourse(i){si=i;pi=0;vi=0;titleEl.textContent=stages[i].title;renderList();renderLesson();modal.classList.add("show");modal.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closeCourse(){renderTok++;destroyPlayer();modal.classList.remove("show");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";const f=modal.querySelector("iframe");if(f)f.src="";const v=modal.querySelector("video");if(v)v.pause()}
/* ---------- القايمة الجانبية ---------- */
function renderList(){
  const old=listEl.querySelector(".pl.open .pl-videos"),st=old?old.scrollTop:0;
  listEl.innerHTML="";
  stages[si].playlists.forEach((p,i)=>{
    const pm=isPLMode(p);
    const items=pm?(p._ids||[]).map((id,j)=>({key:"yt:"+id,title:titleCache[id]||("فيديو "+(j+1))})):p.videos.map(v=>({key:vKeyOf(v),title:v.title}));
    const done=items.filter(x=>isW(x.key)).length;
    const item=document.createElement("li");item.className="pl"+(i===pi?" open":"");
    const head=document.createElement("button");head.className="pl-head";
    const sp=document.createElement("span");sp.textContent="📚 "+p.title;
    const sm=document.createElement("small");sm.textContent=items.length?(done+"/"+items.length+" ✓"):(p.ytList?"بلاي ليست":"قريبًا");
    head.appendChild(sp);head.appendChild(sm);
    head.onclick=()=>{if(pi!==i){pi=i;vi=0;renderList();renderLesson()}else item.classList.toggle("open")};
    item.appendChild(head);
    const ul=document.createElement("ul");ul.className="pl-videos";
    if(items.length){
      items.forEach((x,j)=>{
        const isCur=pm?(i===pi&&curId&&x.key==="yt:"+curId):(i===pi&&j===vi);
        const li=document.createElement("li");li.className="vrow";
        const b=document.createElement("button");b.className="vbtn"+(isCur?" active":"")+(isW(x.key)?" done":"");
        b.textContent=(isW(x.key)?"✓ ":"")+(j+1)+". "+x.title;
        b.onclick=()=>{
          if(pm&&i===pi&&player&&player.playVideoAt){player.playVideoAt(j)}
          else{pi=i;vi=j;renderList();renderLesson()}
        };
        const c=document.createElement("button");c.className="vchk"+(isW(x.key)?" on":"");c.title=isW(x.key)?"إلغاء علامة المشاهدة":"علّم إنك شفته";c.textContent="✓";
        c.onclick=e=>{e.stopPropagation();setW(x.key,!isW(x.key))};
        li.appendChild(b);li.appendChild(c);ul.appendChild(li);
      });
    }else{
      const e=document.createElement("li");e.className="pl-empty";
      e.textContent=pm?(i===pi?"جاري تحميل قايمة الفيديوهات…":"افتح البلاي ليست دي عشان تظهر فيديوهاتها."):"لسه مفيش فيديوهات مضافة للبلاي ليست دي.";
      ul.appendChild(e);
    }
    item.appendChild(ul);listEl.appendChild(item);
    if(i===pi)ul.scrollTop=st;
  });
}
/* ---------- المشغّل ---------- */
function renderLesson(auto){
  destroyPlayer();const tok=++renderTok;curId=null;
  const p=stages[si].playlists[pi],vids=p.videos,v=vids[vi],pm=isPLMode(p);
  let box='<div class="video-placeholder"><strong>🎬 مفيش فيديوهات مضافة للبلاي ليست دي لسه</strong><span>أضف رابط بلاي ليست يوتيوب في academy-data.js.</span></div>',title=p.title,desc=p.description||"",crumb="📚 "+p.title,res=[];
  if(v){
    title=v.title;desc=v.description||p.description||"";crumb="📚 "+p.title+" • فيديو "+(vi+1)+" من "+vids.length;res=v.resources||[];
    if(v.videoType==="youtube"&&ytId(v.video)){box='<div id="ytBox"></div>';curId=ytId(v.video)}
    else if(v.videoType==="file"&&v.video)box='<video id="fileVid" controls preload="metadata"><source src="'+v.video+'">المتصفح لا يدعم تشغيل الفيديو.</video>';
  }else if(pm&&listId(p.ytList))box='<div id="ytBox"></div>';
  const resources=res.length?'<h4 style="color:var(--green);margin-top:20px">ملفات وروابط الدرس</h4><div class="resource-list">'+res.map(r=>'<a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+(r.type==="pdf"?"📄 ":r.type==="image"?"🖼️ ":"🔗 ")+r.title+'</a>').join("")+'</div>':"";
  const nav=(!pm&&vids.length>1)?'<div class="lesson-nav"><button id="prevLesson" '+(vi===0?"disabled":"")+'>الفيديو السابق</button><button id="nextLesson" '+(vi===vids.length-1?"disabled":"")+'>الفيديو التالي</button></div>':"";
  details.innerHTML='<div class="pl-crumb" id="vCrumb">'+crumb+'</div><h3 id="vTitle">'+title+'</h3><p class="lesson-description">'+desc+'</p><div class="video-frame">'+box+'</div>'+resources+nav;
  const pv=document.getElementById("prevLesson"),nx=document.getElementById("nextLesson");
  if(pv)pv.onclick=()=>{if(vi>0){vi--;renderList();renderLesson()}};if(nx)nx.onclick=()=>{if(vi<vids.length-1){vi++;renderList();renderLesson()}};
  const fv=document.getElementById("fileVid");
  if(fv){const k=vKeyOf(v);fv.ontimeupdate=()=>{if(fv.duration&&fv.currentTime/fv.duration>=0.9&&!isW(k))setW(k,true)};fv.onended=()=>{setW(k,true);if(vi<vids.length-1){vi++;renderList();renderLesson(true)}}}
  if(document.getElementById("ytBox")){
    loadYT().then(()=>{
      if(tok!==renderTok||!document.getElementById("ytBox"))return;
      const vars={rel:0,modestbranding:1,playsinline:1};
      const cfg={host:"https://www.youtube-nocookie.com",width:"100%",height:"100%",playerVars:vars,events:{onStateChange:onState}};
      if(pm){vars.listType="playlist";vars.list=listId(p.ytList);if(vi>0)vars.index=vi;cfg.events.onReady=()=>fetchIds(p,tok,0)}
      else{cfg.videoId=curId;if(auto)vars.autoplay=1}
      player=new YT.Player("ytBox",cfg);
      timer=setInterval(tick,1000);
    }).catch(()=>{
      const el=document.getElementById("ytBox");if(!el||tok!==renderTok)return;
      const src=pm?ytListEmbed(p.ytList):"https://www.youtube-nocookie.com/embed/"+curId;
      el.outerHTML='<iframe src="'+src+'" title="فيديو" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    });
  }
}
document.getElementById("closeModal").onclick=closeCourse;modal.addEventListener("click",e=>{if(e.target===modal)closeCourse()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("show"))closeCourse()});
</script></body></html>
