<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لاب 2: تجاوز المصادقة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #fff3e0; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 500px; margin: auto; text-align: center;}
        h1 { color: #e65100; }
        input { padding: 10px; margin: 10px 0; width: 90%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        .btn { padding: 10px 15px; background: #e65100; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 90%;}
        .btn:hover { background: #e65100; }
        #msg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟡 لاب 2: تجاوز نظام تسجيل الدخول</h1>
        <p>هناك ثغرة في كود التحقق من كلمة المرور (Hardcoded Credentials). حاول معرفة بيانات الدخول الصحيحة (أو اقرأ السورس كود) لتسجيل الدخول.</p>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="btn" onclick="login()">تسجيل الدخول</button>
        <p id="msg"></p>
    </div>
    <script>
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // الثغرة: التحقق يتم من جهة العميل وبشكل مكشوف
            if(user === "admin" && pass === "cobra2026") {
                document.getElementById('msg').innerHTML = "<span style='color:green'>نجاح! لقد اكتشفت كلمة المرور (FLAG{Auth_Bypassed})</span>";
            } else {
                document.getElementById('msg').innerHTML = "<span style='color:red'>فشل تسجيل الدخول. حاول مرة أخرى.</span>";
            }
        }
    </script>
</body>
</html>
