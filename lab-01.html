<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لاب 1: أساسيات استخراج البيانات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #e8f5e9; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center;}
        h1 { color: #2e7d32; }
        .btn { padding: 10px 20px; background: #2e7d32; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #1b5e20; }
        #target { margin: 20px auto; padding: 15px; border: 2px dashed #a5d6a7; width: 60%; background: #f1f8e9; min-height: 50px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🟢 لاب 1: استخراج البيانات المخفية</h1>
        <p>هذا اللاب يعلمك كيفية قراءة البيانات وجلبها من كائن (Object) مخفي في الخلفية.</p>
        <div id="target">البيانات ستظهر هنا...</div>
        <button class="btn" onclick="fetchData()">جلب البيانات السرية</button>
    </div>
    <script>
        // محاكاة لقاعدة بيانات (Firestore Document Simulator)
        const mockDatabase = { secretUser: { name: "CobraAdmin", role: "SuperUser", flag: "FLAG{Cobra_Basics_Done}" } };
        
        function fetchData() {
            document.getElementById('target').innerHTML = 
                "الاسم: " + mockDatabase.secretUser.name + "<br>" +
                "الصلاحية: " + mockDatabase.secretUser.role + "<br><br>" + 
                "<span style='color:red'>السر: " + mockDatabase.secretUser.flag + "</span>";
            alert("أحسنت! لقد نجحت في جلب البيانات المخفية.");
        }
    </script>
</body>
</html>
